[project]
name = "easy-study"
version = "0.1.0"
description = "Telegram Bot and Mini App MVP for student work orders"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.7.0",
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.30",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
