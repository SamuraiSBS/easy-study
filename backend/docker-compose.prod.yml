services:
  api:
    build:
      context: .
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    volumes:
      - api_uploads:/app/uploads
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m app.seed_data && uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  api_uploads:
