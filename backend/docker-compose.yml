services:
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://easy_study:easy_study@db:5432/easy_study
      AUTO_CREATE_DB: "false"
    ports:
      - "8000:8000"
    volumes:
      - api_uploads:/app/uploads
    command: sh -c "alembic upgrade head && python -m app.seed_data && uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: easy_study
      POSTGRES_USER: easy_study
      POSTGRES_PASSWORD: easy_study
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easy_study -d easy_study"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  api_uploads:
  postgres_data:
